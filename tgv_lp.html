    * { margin: 0; padding: 0; box-sizing: border-box; }

      flex-direction: column;

      display: block;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid #1e1e1e;
      transition: border-color 0.3s ease;

      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      filter: brightness(0.5);
      transition: filter 0.4s ease, transform 0.5s ease;

    .store-card:hover img {
      filter: brightness(0.65);
      transform: scale(1.04);

    .store-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 22px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));

    .store-location {
      font-size: 9px;
      letter-spacing: 4px;
      color: #c9a84c;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .store-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
    }
    .tap-hint {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      font-size: 18px;
      color: #c9a84c;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .store-card:hover .tap-hint { opacity: 1; }
    .footer {
      margin-top: 44px;
      font-size: 9px;
      letter-spacing: 3px;
      color: #333;
      text-align: center;
      text-transform: uppercase;
